<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOMKA CONSTRUCCIONES — Mis Proyectos</title>
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--bg:#f4efe7;--white:#ffffff;--green:#1b7a51;--green-dk:#155c3c;--green-lt:#e8f5ee;--text:#2c2c2c;--gray:#5a5a5a;--gray-lt:#9a9a9a;--line:#d6cfc5}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);min-height:100vh}
    h1,h2,h3{font-family:'DM Serif Display',serif;font-weight:400}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;border:none;font-family:'DM Sans',sans-serif}

    .portal-header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.04)}
    .portal-logo{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--green)}
    .nav-back{font-size:.85rem;color:var(--green);font-weight:600;display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;border:1.5px solid var(--green);transition:all .18s}
    .nav-back:hover{background:var(--green-lt)}

    .main{max-width:960px;margin:0 auto;padding:40px 20px 80px}
    .page-title{margin-bottom:32px}
    .page-title h1{font-size:2rem;margin-bottom:4px}
    .page-title p{color:var(--gray-lt);font-size:.9rem}

    /* Proyecto card */
    .proy-card{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:box-shadow .2s}
    .proy-card:hover{box-shadow:0 6px 28px rgba(27,122,81,.09)}
    .proy-card-header{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;cursor:pointer}
    .proy-num{font-family:'DM Serif Display',serif;font-size:1.15rem}
    .proy-nombre{font-size:.88rem;color:var(--gray);margin-top:2px}
    .badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:999px}
    .badge-pendiente{background:#fef9c3;color:#854d0e}
    .badge-en_ejecucion{background:#dbeafe;color:#1e40af}
    .badge-finalizado{background:#dcfce7;color:#166534}
    .badge-suspendido{background:#fee2e2;color:#991b1b}

    /* Tabs */
    .tabs-bar{display:flex;border-bottom:2px solid var(--line);padding:0 26px;background:#fafaf9}
    .tab-pill{font-size:.82rem;font-weight:600;padding:12px 16px;border:none;background:none;color:var(--gray-lt);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:all .18s}
    .tab-pill.active{color:var(--green);border-bottom-color:var(--green)}
    .tab-body{padding:22px 26px;display:none}
    .tab-body.active{display:block}

    /* Documentos */
    .doc-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);last-child:border-0}
    .doc-icon{width:36px;height:36px;border-radius:9px;background:var(--green-lt);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
    .doc-info{flex:1;min-width:0}
    .doc-name{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .doc-meta{font-size:.75rem;color:var(--gray-lt);margin-top:2px}
    .badge-doc-pendiente{background:#fef9c3;color:#854d0e;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px}
    .badge-doc-aprobado{background:#dcfce7;color:#166534;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px}
    .badge-doc-rechazado{background:#fee2e2;color:#991b1b;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px}
    .btn-ver{font-size:.78rem;color:var(--green);font-weight:600;padding:5px 12px;border-radius:8px;border:1.5px solid var(--green);background:none;transition:all .18s}
    .btn-ver:hover{background:var(--green-lt)}

    /* Evidencias */
    .semana-label{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-lt);margin:18px 0 10px;display:block}
    .evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .ev-img{width:100%;height:95px;object-fit:cover;border-radius:10px;cursor:pointer;transition:opacity .2s;display:block}
    .ev-img:hover{opacity:.85}
    .ev-file{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:.82rem;color:var(--gray);transition:all .18s}
    .ev-file:hover{border-color:var(--green);color:var(--green);background:var(--green-lt)}
    .ev-link{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;font-size:.82rem;color:#1d4ed8;transition:all .18s;grid-column:1/-1}
    .ev-link:hover{background:#dbeafe}

    /* Lightbox imágenes */
    #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
    #lightbox img{max-width:90vw;max-height:90vh;border-radius:10px}

    /* Preview documentos */
    #doc-preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:700;display:flex;align-items:center;justify-content:center;padding:20px}
    #doc-preview-box{background:#fff;border-radius:16px;width:100%;max-width:860px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    #doc-preview-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);flex-shrink:0}
    #doc-preview-title{font-weight:700;font-size:.95rem;color:var(--text);max-width:600px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #doc-preview-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#f0f0f0;min-height:300px}
    #doc-preview-body iframe{width:100%;height:75vh;border:none}
    #doc-preview-body img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:0}
    #doc-preview-body video{max-width:100%;max-height:75vh}
    .btn-preview-close{background:none;border:none;font-size:1.4rem;color:var(--gray-lt);cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s}
    .btn-preview-close:hover{background:var(--bg);color:var(--text)}

    .empty{text-align:center;padding:48px 20px;color:var(--gray-lt)}
    .empty i{font-size:2.2rem;color:var(--line);display:block;margin-bottom:12px}
    .spinner{text-align:center;padding:60px;color:var(--gray-lt)}
  </style>
</head>
<body>

<header class="portal-header">
  <span class="portal-logo">DOMKA CONSTRUCCIONES</span>
  <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> Portal</a>
</header>

<div class="main">
  <div class="page-title">
    <h1>Mis proyectos</h1>
    <p>Seguimiento de obras, documentos y evidencias</p>
  </div>

  <div id="lista-proyectos">
    <div class="spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
  </div>
</div>

<!-- Preview documento -->
<div id="doc-preview-overlay" style="display:none" onclick="if(event.target===this)cerrarPreview()">
  <div id="doc-preview-box">
    <div id="doc-preview-header">
      <span id="doc-preview-title">Documento</span>
      <div style="display:flex;gap:8px;align-items:center">
        <a id="doc-preview-download" href="#" download class="btn-ver" style="font-size:.78rem">⬇ Descargar</a>
        <button class="btn-preview-close" onclick="cerrarPreview()">✕</button>
      </div>
    </div>
    <div id="doc-preview-body"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" style="display:none" onclick="this.style.display='none'">
  <img id="lb-img" src="" alt="">
</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  
<script src="../js/config.js"></script>
<script src="../js/firebase.js"></script>
<script src="../js/security.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/auth.js"></script>
<script>
  const badgeCls = {pendiente:'badge-pendiente',en_ejecucion:'badge-en_ejecucion',finalizado:'badge-finalizado',suspendido:'badge-suspendido'};
  const badgeLbl = {pendiente:'⏳ Pendiente',en_ejecucion:'🔧 En ejecución',finalizado:'✅ Finalizado',suspendido:'⏸ Suspendido'};

  let _perfil = null;
  let _proyectosLista = []; // lista ligera para las cards
  let _proyectosCache = {}; // cache de docs completos con base64

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmtDate(ts){try{const d=ts?.toDate?ts.toDate():(ts?new Date(ts):null);return d?d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}):'—'}catch{return'—'}}

  function semanaLabel(ts){
    try{
      const d=ts?.toDate?ts.toDate():(ts?new Date(ts):new Date());
      const day=d.getDay();
      const diff=d.getDate()-day+(day===0?-6:1);
      const lun=new Date(new Date(d).setDate(diff));
      return 'Semana del '+lun.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
    }catch{return'Sin fecha'}
  }

  function tipoIcon(ev){
    const ct=(ev.contentType||ev.tipo||'').toLowerCase();
    const n=(ev.name||ev.nombre||'').toLowerCase();
    if(ct.startsWith('image/'))return'🖼️';
    if(ct.startsWith('video/'))return'🎬';
    if(ct==='application/pdf'||n.endsWith('.pdf'))return'📄';
    if(n.endsWith('.zip')||n.endsWith('.rar'))return'🗜️';
    if(ev.tipo==='link')return'🔗';
    return'📎';
  }

  function canApprove(p) {
    const uid = window.auth?.currentUser?.uid;
    if (!uid) return false;
    return (p.aprobadores || []).some(a => a.uid === uid);
  }

  function switchTab(proyId, tab){
    document.querySelectorAll('[data-proy="'+proyId+'"].tab-body').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('[data-proy="'+proyId+'"].tab-pill').forEach(el=>el.classList.remove('active'));
    document.getElementById('tab-'+proyId+'-'+tab)?.classList.add('active');
    document.getElementById('pill-'+proyId+'-'+tab)?.classList.add('active');
  }

  // Carga el doc completo (con base64) y refresca las tabs del proyecto
  async function cargarProyectoCompleto(pid) {
    const tabDocs = document.getElementById('tab-'+pid+'-docs');
    const tabEvid = document.getElementById('tab-'+pid+'-evid');
    const tabAct  = document.getElementById('tab-'+pid+'-act');
    if (tabDocs) tabDocs.innerHTML = '<p style="color:var(--gray-lt);font-size:.85rem;padding:16px 0"><i class="fas fa-circle-notch fa-spin"></i> Cargando…</p>';
    if (tabEvid) tabEvid.innerHTML = '';
    if (tabAct)  tabAct.innerHTML  = '';

    try {
      const snap = await db.collection('proyectos').doc(pid).get();
      if (!snap.exists) return;
      const p = { id: pid, ...snap.data() };
      _proyectosCache[pid] = p;

      const docs = p.documentos  || [];
      const evs  = p.evidencias  || [];
      const acts = p.actividades || [];

      const pillDocs = document.getElementById('pill-'+pid+'-docs');
      const pillEvid = document.getElementById('pill-'+pid+'-evid');
      const pillAct  = document.getElementById('pill-'+pid+'-act');
      if (pillDocs) pillDocs.innerHTML = `<i class="fas fa-file-alt" style="margin-right:5px"></i>Documentos ${docs.length?'('+docs.length+')':''}`;
      if (pillEvid) pillEvid.innerHTML = `<i class="fas fa-images" style="margin-right:5px"></i>Evidencias ${evs.length?'('+evs.length+')':''}`;
      if (pillAct)  pillAct.innerHTML  = `<i class="fas fa-tasks" style="margin-right:5px"></i>Actividades ${acts.length?'('+acts.length+')':''}`;

      if (tabDocs) tabDocs.innerHTML = renderDocumentos(p);
      if (tabEvid) tabEvid.innerHTML = renderEvidencias(p);
      if (tabAct)  tabAct.innerHTML  = renderActividades(acts);
    } catch(e) {
      console.error('Error cargando proyecto completo:', e);
      if (tabDocs) tabDocs.innerHTML = '<p style="color:#991b1b;font-size:.85rem;padding:12px 0">Error cargando el proyecto.</p>';
    }
  }

  function renderActividades(lista) {
    if (!lista || !lista.length) return '<p style="color:var(--gray-lt);font-size:.88rem;padding:12px 0">Sin actividades registradas.</p>';
    return '<div style="padding:8px 0">' + lista.slice().reverse().map(a => {
      const fecha = a.creadoEn ? new Date(a.creadoEn).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) : '';
      const hechoFecha = a.hechoEn ? new Date(a.hechoEn).toLocaleDateString('es-CO',{day:'2-digit',month:'short'}) : '';
      return `
        <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)">
          <div style="margin-top:2px;width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;
            background:${a.hecho?'#166534':'#f3f4f6'};color:${a.hecho?'#fff':'#9a9a9a'};border:2px solid ${a.hecho?'#166534':'#d1d5db'}">
            ${a.hecho?'✓':''}
          </div>
          <div style="flex:1">
            <p style="font-size:.88rem;color:${a.hecho?'var(--gray-lt)':'var(--text)'};${a.hecho?'text-decoration:line-through':''}">${esc(a.texto)}</p>
            <p style="font-size:.72rem;color:var(--gray-lt);margin-top:3px">
              ${esc(a.autorNombre||'Staff')} · ${fecha}
              ${a.hecho?`<span style="color:#166534;margin-left:6px">✓ Completado${hechoFecha?' el '+hechoFecha:''}</span>`:''}
            </p>
          </div>
        </div>`;
    }).join('') + '</div>';
  }

  function renderDocumentos(p) {
    const docs = p.documentos || [];
    if (!docs.length) return '<p style="color:var(--gray-lt);font-size:.88rem;padding:12px 0">Sin documentos aún.</p>';

    const tiposOrden = ['Acta de Inicio','Contrato','Acta de Cierre','Informe','Otro'];
    const agrupados = {};
    docs.forEach(d => { const t = d.tipo||'Otro'; if (!agrupados[t]) agrupados[t]=[]; agrupados[t].push(d); });

    return tiposOrden
      .filter(t => agrupados[t])
      .concat(Object.keys(agrupados).filter(t => !tiposOrden.includes(t)))
      .map(tipo => `
        <div style="margin-bottom:14px">
          <p style="font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:6px">${esc(tipo)}</p>
          ${agrupados[tipo].map(d => {
            const bc = d.estado==='aprobado'?'badge-doc-aprobado':d.estado==='rechazado'?'badge-doc-rechazado':'badge-doc-pendiente';
            const bl = d.estado==='aprobado'?'Aprobado ✓':d.estado==='rechazado'?'Rechazado':'Pendiente';
            const puedeAprobar = canApprove(p) && d.estado !== 'aprobado';
            return `
              <div class="doc-row">
                <div class="doc-icon">📄</div>
                <div class="doc-info">
                  <div class="doc-name">${esc(d.nombre||d.tipo)}</div>
                  <div class="doc-meta">${esc(d.tipo||'')} · ${fmtDate(d.creadoEn)}</div>
                </div>
                <span class="${bc}">${bl}</span>
                ${d.base64?`<button onclick="abrirPreview('${esc(d.fileName||d.nombre||'documento')}','${d.contentType||''}','${d.base64}')" class="btn-ver">👁 Ver</button>`:''}
                ${d.base64?`<a href="${d.base64}" download="${esc(d.fileName||d.nombre||'documento')}" class="btn-ver">⬇</a>`:''}
                ${d.url?`<button onclick="abrirPreviewUrl('${esc(d.nombre||d.tipo)}','${esc(d.url)}')" class="btn-ver">👁 Ver</button>`:''}
                ${puedeAprobar?`<button onclick="aprobarDocPortal('${p.id}','${esc(d.nombre||d.tipo)}')"
                  style="font-size:.75rem;background:var(--green);color:#fff;padding:5px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600">
                  ✅ Aprobar
                </button>`:''}
              </div>`;
          }).join('')}
        </div>`).join('');
  }

  function renderEvidencias(p) {
    const evs = p.evidencias || [];
    if (!evs.length) return '<p style="color:var(--gray-lt);font-size:.88rem;padding:12px 0">Sin evidencias aún.</p>';

    const semanas = {};
    evs.slice().reverse().forEach(ev => {
      const sk = semanaLabel(ev.uploadedAt||ev.fecha);
      if (!semanas[sk]) semanas[sk]=[];
      semanas[sk].push(ev);
    });

    return Object.entries(semanas).map(([sem, items]) => `
      <span class="semana-label">${esc(sem)}</span>
      <div class="evidence-grid">
        ${items.map(ev => {
          const isImg  = (ev.contentType||ev.tipo||'').startsWith('image/');
          const isVid  = (ev.contentType||ev.tipo||'').startsWith('video/');
          const isLink = ev.tipo==='link';
          const label  = esc(ev.name||ev.nombre||ev.url||'Archivo');
          const icon   = tipoIcon(ev);
          if (isLink) return `<a href="${esc(ev.url)}" target="_blank" class="ev-link">${icon} <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</span></a>`;
          if (isImg && ev.base64) return `<div><img class="ev-img" src="${ev.base64}" alt="${label}" onclick="document.getElementById('lb-img').src=this.src;document.getElementById('lightbox').style.display='flex'"></div>`;
          if (isVid && ev.base64) return `<video style="width:100%;height:95px;object-fit:cover;border-radius:10px" controls><source src="${ev.base64}" type="${esc(ev.contentType)}"></video>`;
          if (ev.base64) return `<a href="${ev.base64}" download="${label}" class="ev-file">${icon} <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</span></a>`;
          return '';
        }).join('')}
      </div>`).join('');
  }

  window.aprobarDocPortal = async function(proyId, docNombre) {
    if (!confirm('¿Aprobar el documento "'+docNombre+'"?')) return;
    try {
      // Leer doc fresco para no pisar otros cambios concurrentes
      const snap = await db.collection('proyectos').doc(proyId).get();
      const data = snap.data() || {};
      const docs = (data.documentos || []).map(d =>
        (d.nombre === docNombre || d.tipo === docNombre)
          ? { ...d, estado:'aprobado', aprobadoPor: window.auth?.currentUser?.uid, aprobadoEn: new Date().toISOString() }
          : d
      );
      // set con merge:true para no requerir validProyecto completo en reglas
      await db.collection('proyectos').doc(proyId).set({ documentos: docs }, { merge: true });
      // Actualizar cache y re-renderizar
      if (_proyectosCache[proyId]) {
        _proyectosCache[proyId].documentos = docs;
        const tabDocs = document.getElementById('tab-'+proyId+'-docs');
        if (tabDocs) tabDocs.innerHTML = renderDocumentos(_proyectosCache[proyId]);
      }
      // Feedback visual breve
      const btn = event?.target;
      if (btn) { btn.textContent = '✓ Aprobado'; btn.disabled = true; btn.style.background = '#166534'; }
    } catch(e) {
      alert('Error al aprobar: ' + (e?.message || e));
    }
  };

  window.abrirPreview = function(nombre, contentType, base64) {
    const overlay = document.getElementById('doc-preview-overlay');
    const body    = document.getElementById('doc-preview-body');
    const title   = document.getElementById('doc-preview-title');
    const dlBtn   = document.getElementById('doc-preview-download');
    if (!overlay || !body) return;

    title.textContent = nombre;
    dlBtn.href = base64;
    dlBtn.download = nombre;

    const ct = (contentType || '').toLowerCase();
    if (ct.startsWith('image/')) {
      body.innerHTML = `<img src="${base64}" alt="${nombre}">`;
    } else if (ct === 'application/pdf') {
      body.innerHTML = `<iframe src="${base64}" title="${nombre}"></iframe>`;
    } else if (ct.startsWith('video/')) {
      body.innerHTML = `<video controls><source src="${base64}" type="${ct}"></video>`;
    } else {
      // Para Word, Excel, ZIP: no hay preview nativo, mostrar botón de descarga
      body.innerHTML = `
        <div style="text-align:center;padding:48px 24px;color:var(--gray-lt)">
          <div style="font-size:3rem;margin-bottom:16px">📎</div>
          <p style="font-weight:600;color:var(--text);margin-bottom:8px">${nombre}</p>
          <p style="font-size:.85rem;margin-bottom:20px">Este tipo de archivo no tiene vista previa disponible.</p>
          <a href="${base64}" download="${nombre}" class="btn-ver" style="display:inline-block;padding:10px 24px;font-size:.9rem">⬇ Descargar archivo</a>
        </div>`;
    }

    overlay.style.display = 'flex';
  };

  window.abrirPreviewUrl = function(nombre, url) {
    const overlay = document.getElementById('doc-preview-overlay');
    const body    = document.getElementById('doc-preview-body');
    const title   = document.getElementById('doc-preview-title');
    const dlBtn   = document.getElementById('doc-preview-download');
    if (!overlay || !body) return;

    title.textContent = nombre;
    dlBtn.href = url;
    dlBtn.download = nombre;

    body.innerHTML = `<iframe src="${url}" title="${nombre}"></iframe>`;
    overlay.style.display = 'flex';
  };

  window.cerrarPreview = function() {
    const overlay = document.getElementById('doc-preview-overlay');
    const body    = document.getElementById('doc-preview-body');
    if (overlay) overlay.style.display = 'none';
    if (body)    body.innerHTML = ''; // liberar memoria base64
  };

  document.addEventListener('DOMContentLoaded', async () => {
    await Promise.resolve(window.__domkaFirebaseReady);
    if (!window.auth || !window.db) return;
    const unsub = window.auth.onAuthStateChanged(async (user) => {
      if (!user) return;
      unsub();
      _perfil = await cargarPerfil(user);
      const clienteId = _perfil?.clienteId;
      const empresaId = _perfil?.empresaId;
      if (!clienteId && !empresaId) {
        document.getElementById('lista-proyectos').innerHTML =
          '<div class="empty"><i class="fas fa-exclamation-circle"></i><p>Cuenta no vinculada.<br>Contacta a DOMKA CONSTRUCCIONES.</p></div>';
        return;
      }
      try {
        const uid = user.uid;
        const [snapCli, snapEmp, snapUid] = await Promise.all([
          clienteId ? db.collection('proyectos').where('clienteId','==',clienteId).get() : Promise.resolve(null),
          empresaId ? db.collection('proyectos').where('empresaId','==',empresaId).get() : Promise.resolve(null),
          db.collection('proyectos').where('uidsAsociados','array-contains',uid).get()
        ]);
        const map = new Map();
        (snapCli?.docs||[]).forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
        (snapEmp?.docs||[]).forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
        (snapUid?.docs||[]).forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
        _proyectosLista = Array.from(map.values())
          .sort((a,b)=>{
            const ad=a.creadoEn?.toDate?a.creadoEn.toDate().getTime():new Date(a.creadoEn||0).getTime();
            const bd=b.creadoEn?.toDate?b.creadoEn.toDate().getTime():new Date(b.creadoEn||0).getTime();
            return bd-ad;
          });
        renderProyectos(_proyectosLista);
      } catch(e) {
        console.error(e);
        document.getElementById('lista-proyectos').innerHTML =
          '<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Error cargando proyectos.</p></div>';
      }
    });
  });

  function renderProyectos(list) {
    const c = document.getElementById('lista-proyectos');
    if (!list.length) {
      c.innerHTML = '<div class="empty"><i class="fas fa-hard-hat"></i><p>Aún no tienes proyectos.</p></div>';
      return;
    }

    c.innerHTML = list.map(p => {
      const pid    = p.id;
      const estado = p.estado || 'pendiente';
      const docCount = (p.documentos||[]).length;
      const evCount  = (p.evidencias||[]).length;

      return `
        <div class="proy-card">
          <div class="proy-card-header" onclick="toggleProy('${pid}')">
            <div>
              <div class="proy-num">${esc(p.numero||p.id.slice(0,8).toUpperCase())}</div>
              ${p.nombre?`<div class="proy-nombre">${esc(p.nombre)}</div>`:''}
              <div style="font-size:.8rem;color:var(--gray-lt);margin-top:4px">${fmtDate(p.creadoEn)}</div>
            </div>
            <div style="text-align:right">
              <span class="badge ${badgeCls[estado]||'badge-pendiente'}">${badgeLbl[estado]||estado}</span>
              <div style="font-size:.75rem;color:var(--gray-lt);margin-top:6px">
                ${docCount?`📄 ${docCount} doc${docCount!==1?'s':''}`:''} ${evCount?`📷 ${evCount} evidencia${evCount!==1?'s':''}` : ''}
              </div>
              <div style="font-size:.72rem;color:var(--green);margin-top:4px;font-weight:600">
                <i class="fas fa-chevron-down" id="chevron-${pid}"></i> Ver detalle
              </div>
            </div>
          </div>

          ${p.descripcion?`<div style="padding:14px 26px;font-size:.88rem;color:var(--gray);border-bottom:1px solid var(--line)">${esc(p.descripcion)}</div>`:''}

          <div id="detalle-${pid}" style="display:none">
            <div class="tabs-bar">
              <button id="pill-${pid}-docs" class="tab-pill active" data-proy="${pid}" onclick="switchTab('${pid}','docs')">
                <i class="fas fa-file-alt" style="margin-right:5px"></i>Documentos ${docCount?'('+docCount+')':''}
              </button>
              <button id="pill-${pid}-evid" class="tab-pill" data-proy="${pid}" onclick="switchTab('${pid}','evid')">
                <i class="fas fa-images" style="margin-right:5px"></i>Evidencias ${evCount?'('+evCount+')':''}
              </button>
              <button id="pill-${pid}-act" class="tab-pill" data-proy="${pid}" onclick="switchTab('${pid}','act')">
                <i class="fas fa-tasks" style="margin-right:5px"></i>Actividades
              </button>
            </div>
            <div id="tab-${pid}-docs" class="tab-body active" data-proy="${pid}">
              <p style="color:var(--gray-lt);font-size:.85rem;padding:16px 0"><i class="fas fa-circle-notch fa-spin"></i> Cargando…</p>
            </div>
            <div id="tab-${pid}-evid" class="tab-body" data-proy="${pid}"></div>
            <div id="tab-${pid}-act" class="tab-body" data-proy="${pid}"></div>
          </div>
        </div>`;
    }).join('');
  }

  window.toggleProy = function(pid) {
    const detalle = document.getElementById('detalle-'+pid);
    const chevron = document.getElementById('chevron-'+pid);
    if (!detalle) return;
    const abriendo = detalle.style.display === 'none';
    detalle.style.display = abriendo ? 'block' : 'none';
    if (chevron) chevron.className = abriendo ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
    // Solo carga desde Firestore la primera vez
    if (abriendo && !_proyectosCache[pid]) {
      cargarProyectoCompleto(pid);
    }
  };
</script>
</body>
</html>
