<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOMKA — Mis Cotizaciones</title>
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--bg:#f4efe7;--white:#ffffff;--green:#1b7a51;--green-dk:#155c3c;--green-lt:#e8f5ee;--text:#2c2c2c;--gray:#5a5a5a;--gray-lt:#9a9a9a;--line:#d6cfc5}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);min-height:100vh}
    h1,h2,h3{font-family:'DM Serif Display',serif;font-weight:400}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;border:none;font-family:'DM Sans',sans-serif}

    .portal-header{background:var(--white);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.04)}
    .portal-logo{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--green)}
    .nav-back{font-size:.85rem;color:var(--green);font-weight:600;display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;border:1.5px solid var(--green);transition:all .18s}
    .nav-back:hover{background:var(--green-lt)}

    .main{max-width:900px;margin:0 auto;padding:40px 20px 80px}
    .page-title{margin-bottom:32px}
    .page-title h1{font-size:2rem;margin-bottom:4px}
    .page-title p{color:var(--gray-lt);font-size:.9rem}

    /* Cards lista */
    .cot-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:all .2s;flex-wrap:wrap}
    .cot-card:hover{border-color:var(--green);box-shadow:0 4px 20px rgba(27,122,81,.1);transform:translateY(-1px)}
    .cot-numero{font-family:'DM Serif Display',serif;font-size:1.05rem;margin-bottom:3px}
    .cot-fecha{font-size:.78rem;color:var(--gray-lt)}
    .cot-total{font-size:1.1rem;font-weight:700;color:var(--green);white-space:nowrap}
    .badge{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:999px}
    .badge-pendiente{background:#fef9c3;color:#854d0e}
    .badge-aprobada{background:#dcfce7;color:#166534}
    .badge-rechazada{background:#fee2e2;color:#991b1b}
    .badge-enviada{background:#dbeafe;color:#1e40af}

    /* Modal detalle */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
    .modal-box{background:var(--white);border-radius:20px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
    .modal-header{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--green)}
    .modal-header h2{font-family:'DM Serif Display',serif;font-size:1.4rem;color:#fff}
    .modal-header p{font-size:.82rem;color:rgba(255,255,255,.75);margin-top:3px}
    .modal-btn-close{color:rgba(255,255,255,.8);font-size:1.4rem;line-height:1;background:none;border:none;cursor:pointer;padding:4px}
    .modal-btn-close:hover{color:#fff}
    .modal-body{padding:28px}

    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
    .info-item label{display:block;font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-lt);margin-bottom:4px}
    .info-item p{font-size:.92rem;font-weight:600;color:var(--text)}

    /* Items table */
    .items-section{margin-bottom:22px}
    .items-section h4{font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
    .items-table{width:100%;border-collapse:collapse;font-size:.85rem}
    .items-table th{text-align:left;padding:8px 10px;background:#f9f7f4;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-lt);border-bottom:1px solid var(--line)}
    .items-table td{padding:10px 10px;border-bottom:1px solid #f0ece5}
    .items-table tr:last-child td{border-bottom:none}
    .td-right{text-align:right;font-weight:600;color:var(--text)}

    /* Totales */
    .totales-box{background:#f9f7f4;border-radius:12px;padding:16px 20px;margin-bottom:22px}
    .total-row{display:flex;justify-content:space-between;font-size:.88rem;padding:4px 0}
    .total-row.final{font-size:1.05rem;font-weight:700;color:var(--green);border-top:1px solid var(--line);margin-top:8px;padding-top:10px}

    /* Pagos */
    .pagos-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
    .pago-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--green-lt);border-radius:10px;font-size:.85rem}
    .pago-item span:last-child{font-weight:700;color:var(--green)}

    /* Notas */
    .notas-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 16px;font-size:.85rem;color:var(--gray);line-height:1.65;white-space:pre-wrap}

    .btn-ver-pdf{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:var(--green);color:#fff;border-radius:10px;font-weight:700;font-size:.88rem;transition:all .2s;margin-top:4px}
    .btn-ver-pdf:hover{background:var(--green-dk)}

    .empty{text-align:center;padding:80px 20px;color:var(--gray-lt)}
    .empty i{font-size:2.5rem;color:var(--line);display:block;margin-bottom:16px}
    .spinner{text-align:center;padding:60px;color:var(--gray-lt)}
  </style>
</head>
<body>

<header class="portal-header">
  <span class="portal-logo">DOMKA</span>
  <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> Portal</a>
</header>

<div class="main">
  <div class="page-title">
    <h1>Mis cotizaciones</h1>
    <p>Presupuestos y propuestas enviadas por DOMKA</p>
  </div>
  <div id="lista-cotizaciones">
    <div class="spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
  </div>
</div>

<!-- Modal detalle -->
<div id="modal-cot" class="modal-overlay" style="display:none" onclick="if(event.target===this)cerrarModal()">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h2 id="m-numero">—</h2>
        <p id="m-fecha">—</p>
      </div>
      <button class="modal-btn-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">

      <div class="info-grid" id="m-info-grid"></div>

      <div id="m-items-wrap" class="items-section" style="display:none">
        <h4><i class="fas fa-list" style="margin-right:6px"></i>Ítems del servicio</h4>
        <table class="items-table">
          <thead>
            <tr>
              <th>Descripción</th>
              <th style="text-align:center">Cant.</th>
              <th style="text-align:right">Precio</th>
              <th style="text-align:right">Subtotal</th>
            </tr>
          </thead>
          <tbody id="m-items-tbody"></tbody>
        </table>
      </div>

      <div class="totales-box" id="m-totales"></div>

      <div id="m-pagos-wrap" style="display:none;margin-bottom:22px">
        <p style="font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px">
          <i class="fas fa-calendar-check" style="margin-right:5px"></i>Plan de pagos
        </p>
        <div id="m-pagos" class="pagos-list"></div>
      </div>

      <div id="m-notas-wrap" style="display:none;margin-bottom:22px">
        <p style="font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px">
          <i class="fas fa-sticky-note" style="margin-right:5px"></i>Notas y condiciones
        </p>
        <div id="m-notas" class="notas-box"></div>
      </div>

      <div id="m-acciones"></div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth-compat.js"></script>
<script src="../js/config.js"></script>
<script src="../js/firebase.js"></script>
<script src="../js/security.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/auth.js"></script>
<script>
  let _cots = [];

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmt(n){return Number(n||0).toLocaleString('es-CO')}
  function fmtDate(ts){
    try{const d=ts?.toDate?ts.toDate():(ts?new Date(ts):null);return d?d.toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'}):'—'}catch{return'—'}
  }
  function badgeEstado(e){
    const m={pendiente:'badge-pendiente pendiente',aprobada:'badge-aprobada aprobada',rechazada:'badge-rechazada rechazada',enviada:'badge-enviada enviada'};
    const l={pendiente:'⏳ Pendiente',aprobada:'✅ Aprobada',rechazada:'❌ Rechazada',enviada:'📤 Enviada'};
    return `<span class="badge ${m[e]||'badge-pendiente'}">${l[e]||e}</span>`;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await Promise.resolve(window.__domkaFirebaseReady);
    if (!window.auth || !window.db) return;
    const unsub = window.auth.onAuthStateChanged(async (user) => {
      if (!user) return;
      unsub();
      const perfil = await cargarPerfil(user).catch(()=>null);
      const clienteId = perfil?.clienteId;
      const empresaId = perfil?.empresaId;
      if (!clienteId && !empresaId) {
        document.getElementById('lista-cotizaciones').innerHTML =
          '<div class="empty"><i class="fas fa-exclamation-circle"></i><p>Cuenta no vinculada. Contacta a DOMKA.</p></div>';
        return;
      }
      try {
        const [snapCli, snapEmp] = await Promise.all([
          clienteId ? db.collection('cotizaciones').where('clienteId','==',clienteId).get() : Promise.resolve(null),
          empresaId ? db.collection('cotizaciones').where('empresaId','==',empresaId).get() : Promise.resolve(null)
        ]);
        const map = new Map();
        (snapCli?.docs||[]).forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
        (snapEmp?.docs||[]).forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
        _cots = Array.from(map.values()).sort((a,b)=>{
          const ad=a.fecha?.toDate?a.fecha.toDate().getTime():new Date(a.fecha||0).getTime();
          const bd=b.fecha?.toDate?b.fecha.toDate().getTime():new Date(b.fecha||0).getTime();
          return bd-ad;
        });
        renderLista();
      } catch(e) {
        console.error(e);
        document.getElementById('lista-cotizaciones').innerHTML =
          '<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Error cargando cotizaciones.</p></div>';
      }
    });
  });

  function renderLista() {
    const c = document.getElementById('lista-cotizaciones');
    if (!_cots.length) {
      c.innerHTML = '<div class="empty"><i class="fas fa-file-alt"></i><p>Aún no tienes cotizaciones.</p></div>';
      return;
    }
    c.innerHTML = _cots.map(cot => `
      <div class="cot-card" onclick="verDetalle('${cot.id}')">
        <div>
          <div class="cot-numero">${esc(cot.numero||'Cotización')}</div>
          <div class="cot-fecha"><i class="fas fa-calendar" style="margin-right:4px"></i>${fmtDate(cot.fecha)}</div>
          <div style="margin-top:8px">${badgeEstado(cot.estado||'pendiente')}</div>
        </div>
        <div style="text-align:right">
          <div class="cot-total">$${fmt(cot.total)}</div>
          <div style="font-size:.75rem;color:var(--gray-lt);margin-top:4px">${esc(cot.tipo||'')}</div>
          <div style="font-size:.78rem;color:var(--green);margin-top:8px;font-weight:600">Ver detalle →</div>
        </div>
      </div>`).join('');
  }

  function verDetalle(id) {
    const c = _cots.find(x=>x.id===id);
    if (!c) return;

    document.getElementById('m-numero').textContent = c.numero || 'Cotización';
    document.getElementById('m-fecha').textContent = fmtDate(c.fecha);

    // Info grid
    const infos = [
      { label:'Estado',      val: badgeEstado(c.estado||'pendiente'), raw:true },
      { label:'Tipo',        val: c.tipo || '—' },
      { label:'Forma de pago', val: {contado:'Contado','60-40':'60/40','50-50':'50/50','tres-pagos':'3 pagos',personalizado:'Personalizado'}[c.formaPago] || c.formaPago || '—' },
      { label:'Fecha',       val: fmtDate(c.fecha) },
    ];
    document.getElementById('m-info-grid').innerHTML = infos.map(i=>
      `<div class="info-item"><label>${i.label}</label><p>${i.raw?i.val:esc(i.val)}</p></div>`
    ).join('');

    // Items
    const items = c.items || [];
    const itemsWrap = document.getElementById('m-items-wrap');
    if (items.length && c.tipoCalculo !== 'valor-total') {
      itemsWrap.style.display = '';
      document.getElementById('m-items-tbody').innerHTML = items.map(it=>`
        <tr>
          <td>${esc(it.descripcion||'')}</td>
          <td style="text-align:center">${it.cantidad||1}</td>
          <td class="td-right">$${fmt(it.precio)}</td>
          <td class="td-right">$${fmt(it.subtotal)}</td>
        </tr>`).join('');
    } else {
      itemsWrap.style.display = 'none';
    }

    // Totales
    const totalesEl = document.getElementById('m-totales');
    if (c.tipoCalculo !== 'valor-total' && c.subtotal !== c.total) {
      totalesEl.innerHTML = `
        <div class="total-row"><span>Subtotal</span><span>$${fmt(c.subtotal)}</span></div>
        <div class="total-row final"><span>Total</span><span>$${fmt(c.total)}</span></div>`;
    } else {
      totalesEl.innerHTML = `<div class="total-row final"><span>Total</span><span>$${fmt(c.total)}</span></div>`;
    }

    // Plan de pagos
    const pagos = c.planPagos || [];
    const pagosWrap = document.getElementById('m-pagos-wrap');
    if (pagos.length > 1) {
      pagosWrap.style.display = '';
      document.getElementById('m-pagos').innerHTML = pagos.map(p=>`
        <div class="pago-item">
          <span>${esc(p.descripcion||'')}</span>
          <span>$${fmt(p.monto)} (${p.porcentaje}%)</span>
        </div>`).join('');
    } else {
      pagosWrap.style.display = 'none';
    }

    // Notas
    const notas = (c.notasArray||[]).join('\n') || c.notas || '';
    const notasWrap = document.getElementById('m-notas-wrap');
    if (notas.trim()) {
      notasWrap.style.display = '';
      document.getElementById('m-notas').textContent = notas;
    } else {
      notasWrap.style.display = 'none';
    }

    // Acciones
    const accionesEl = document.getElementById('m-acciones');
    accionesEl.innerHTML = '';
    if (c.linkPublico) {
      const btn = document.createElement('a');
      btn.href = c.linkPublico;
      btn.target = '_blank';
      btn.className = 'btn-ver-pdf';
      btn.innerHTML = '<i class="fas fa-file-pdf"></i> Ver cotización completa (PDF)';
      accionesEl.appendChild(btn);
    }

    document.getElementById('modal-cot').style.display = 'flex';
  }

  function cerrarModal() {
    document.getElementById('modal-cot').style.display = 'none';
  }

  window.verDetalle = verDetalle;
  window.cerrarModal = cerrarModal;
</script>
</body>
</html>
