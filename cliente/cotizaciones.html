<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOMKA - Mis Cotizaciones</title>
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>body{font-family:'DM Sans',sans-serif;background:#f4efe7;margin:0}.main{max-width:900px;margin:0 auto;padding:32px 20px}.card{background:#fff;border:1px solid #d6cfc5;border-radius:14px;padding:20px;margin-bottom:14px}.empty{text-align:center;color:#666;padding:60px 10px}</style>
</head>
<body>
<div class="main">
  <h1 style="font-family:'DM Serif Display',serif">Mis cotizaciones</h1>
  <div id="lista-cotizaciones" class="empty">Cargando...</div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth-compat.js"></script>
<script src="../js/config.js"></script>
<script src="../js/firebase.js"></script>
<script src="../js/security.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/auth.js"></script>
<script>
(() => {
  let clienteId = null;
  let empresaId = null;
  const wrap = document.getElementById("lista-cotizaciones");

  function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function ts(v){return v?.toDate?v.toDate().getTime():new Date(v||0).getTime()}

  async function cargar() {
    let docs = [];
    if (empresaId) {
      const a = await db.collection("cotizaciones").where("empresaId","==",empresaId).get().catch(()=>null);
      if (a && !a.empty) docs = a.docs;
    }
    if (!docs.length && clienteId) {
      const b = await db.collection("cotizaciones").where("clienteId","==",clienteId).get();
      docs = b.docs;
    }
    const list = docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>ts(y.fecha)-ts(x.fecha));
    if (!list.length) { wrap.className="empty"; wrap.textContent="Aun no tienes cotizaciones."; return; }
    wrap.className = "";
    wrap.innerHTML = list.map(c=>`<div class="card"><div><b>${esc(c.numero||"Cotizacion")}</b></div><div>Total: $${Number(c.total||0).toLocaleString("es-CO")}</div></div>`).join("");
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await Promise.resolve(window.__domkaFirebaseReady);
    if (!window.auth || !window.db) { wrap.textContent = "Firebase no inicializado."; return; }
    const unsub = window.auth.onAuthStateChanged(async (u) => {
      if (!u) return;
      unsub();
      const perfil = await cargarPerfil(u).catch(()=>null);
      clienteId = perfil?.clienteId || null;
      empresaId = perfil?.empresaId || null;
      if (!clienteId && !empresaId) { wrap.textContent = "Cuenta no vinculada."; return; }
      try { await cargar(); } catch { wrap.textContent = "Error cargando cotizaciones."; }
    });
  });
})();
</script>
</body>
</html>
